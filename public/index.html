function renderCatalogResults(){
  const container=$('#c-results'); if(!container) return;
  reconcileCatalog();
  const lines=S.catLines||[];
  const q=catQuery.trim().toUpperCase();
  const filtered=q?lines.filter(l=>[l.sku,l.upc,l.boxUpc,l.brand].some(x=>(x||'').toUpperCase().includes(q))):lines;

  let summary='';
  const distinctSkus=[...new Set(filtered.map(l=>(l.sku||'').toUpperCase()))];
  if(q&&filtered.length&&distinctSkus.length===1){
    const any=filtered[0];
    const totalQ=filtered.reduce((a,l)=>a+(+l.qty||0),0);
    const placed=filtered.filter(l=>l.loc);
    summary=`<div class="hit-card" style="margin-bottom:14px">
      <div class="hit-sku">${esc(any.sku)}</div>
      <div class="hit-meta">${any.imageUrl?`<img src="${esc(any.imageUrl)}" alt="" loading="lazy"
        onerror="this.style.display='none'" style="width:52px;height:52px;object-fit:contain;
        border-radius:6px;background:#fff;border:1px solid var(--line)">`:''}
        <span>${esc(any.brand||'no brand')}</span><span>item ${esc(any.upc||'—')}</span><span>box ${esc(any.boxUpc||'—')}</span><span>pack ${any.packing??'—'}</span></div>
      <div class="hit-note">${filtered.length} line${filtered.length===1?'':'s'} · ${totalQ.toLocaleString()} pieces total${
        placed.length?` · at ${placed.map(l=>`${l.loc} (${(+l.qty||0).toLocaleString()})`).join(', ')}`:' · not placed on the map yet'}</div>
    </div>`;
  }

  container.innerHTML=summary+(filtered.length
    ? `<table><thead><tr><th style="width:44px"></th><th>SKU</th><th>Barcodes</th><th>Brand</th><th class="num">Pack</th><th class="num">Qty</th><th>Location</th><th></th></tr></thead>
       <tbody>${filtered.slice(0,300).map(catRow).join('')}</tbody></table>
       ${filtered.length>300?`<p class="mini" style="color:var(--ink-2);margin-top:8px">Showing the first 300 of ${filtered.length} matches — narrow the search.</p>`:''}`
    : (lines.length?'<p class="lead" style="margin:0">No matches.</p>':'<p class="lead" style="margin:0">Import your list above to search it.</p>'));

  container.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>openCatEditor(b.dataset.cedit));
  container.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>startPlace(b.dataset.place));
  container.querySelectorAll('[data-unplace]').forEach(b=>b.onclick=()=>unplaceCatLine(b.dataset.unplace));
}

function sortLoc(a,b){
  const pa=a.match(/^([A-Z]+)(\d+)\.(\d+)$/), pb=b.match(/^([A-Z]+)(\d+)\.(\d+)$/);
  if(!pa||!pb) return a.localeCompare(b);
  return pa[1].localeCompare(pb[1])||(+pa[2]-+pb[2])||(+pa[3]-+pb[3]);
}
function splitRow(line){
  // comma or tab separated, honouring simple quoted fields
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if((c===','||c==='\t')&&!q){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur);
  return out.map(x=>x.trim());
}
function num(x){
  if(x==null) return null;
  const v=String(x).replace(/[^0-9.\-]/g,'');
  if(v==='') return null;
  const n=parseFloat(v);
  return isNaN(n)?null:n;
}
function importInv(text){
  const wipe=$('#i-wipe').checked, skipLocked=$('#i-skiplock').checked, create=$('#i-create').checked;
  const raw=(text||'').split(/\r?\n/);
  let ok=0,derived=0,made=0;
  const bad=[],locked=[],noSlot=[],touched=new Set();
  raw.forEach((ln,i)=>{
    if(!ln.trim()) return;
    const p=splitRow(ln);
    if(i===0&&/^loc/i.test(p[0]||'')) return;
    const loc=(p[0]||'').toUpperCase().replace(/\s+/g,'');
    const m=loc.match(/^([A-Z]{1,3})(\d+)\.(\d+)$/);
    if(!m){ bad.push(`${i+1}: ${ln.trim()}`); return; }
    const rk=m[1], bay=m[2], layer=+m[3];
    if(skipLocked&&isLocked(rk)){ if(!locked.includes(rk)) locked.push(rk); return; }

    const sku=p[1]||'';
    const boxes=num(p[2]), packing=num(p[3]);
    let total=num(p[4]);
    if(total==null){
      if(boxes!=null&&packing!=null){ total=boxes*packing; derived++; }
      else { bad.push(`${i+1}: ${ln.trim()} (no total, and boxes × packing can't be worked out)`); return; }
    }
    if(!S.racks[rk]) S.racks[rk]={};
    const arr=S.racks[rk][bay]||[];
    if(!arr.includes(layer)){
      if(!create){ noSlot.push(loc); return; }
      S.racks[rk][bay]=[...arr,layer].sort((a,b)=>a-b); made++;
    }
    if(wipe&&!touched.has(loc)){ S.inv[loc]=[]; touched.add(loc); }
    S.inv[loc]=S.inv[loc]||[];
    S.inv[loc].push({sku,boxes,packing,qty:total});
    ok++;
  });
  const L=[`${ok} line${ok===1?'':'s'} imported.`];
  if(derived) L.push(`${derived} total${derived===1?'':'s'} worked out from boxes × packing.`);
  if(made) L.push(`${made} new slot${made===1?'':'s'} created to hold them.`);
  if(noSlot.length) L.push(`No slot exists for: ${noSlot.join(', ')} — tick "create slots" to add them.`);
  if(locked.length) L.push(`Skipped locked rack${locked.length===1?'':'s'}: ${locked.join(', ')}.`);
  if(bad.length) L.push('Lines not read:\n  '+bad.join('\n  '));
  $('#i-log').textContent=L.join('\n');
  commit(); renderInv(); toast(`${ok} inventory lines imported`);
}

function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

$('#loadsheets').onclick=()=>{
  if(!confirm('Reload every transcribed rack and floor area from the sheets? Anything painted on those racks is replaced. Locked racks are skipped.')) return;
  const done=[],skipped=[];
  for(const r in SHEETS){
    if(isLocked(r)){ skipped.push(r); continue; }
    Object.keys(S.assign).forEach(k=>{ if(k.startsWith(r)&&/^\d/.test(k.slice(r.length))) delete S.assign[k]; });
    S.racks[r]=SHEETS[r].racks();
    if(SHEETS[r].kind) S.kinds[r]=SHEETS[r].kind;
    if(SHEETS[r].label) S.labels[r]=SHEETS[r].label;
    for(const k in SHEETS[r].note) S.assign[r+k]=SHEETS[r].note[k].slice();
    done.push(r);
  }
  commit();
  toast(skipped.length?`Reloaded ${done.join(', ')} — ${skipped.join(', ')} locked`:`Racks ${done.join(', ')} reloaded`);
};

  $('#p-users').classList.toggle('hidden',t!=='users');
  $('#toolsec').style.display = t==='map'?'':'none';
  if(t!=='scan'&&camStream){ camStream.getTracks().forEach(x=>x.stop()); camStream=null; }
  if(t==='catalog') renderCatalog();
  if(t==='inv') renderInv();
  if(t==='scan') renderScan();
  if(t==='summary') renderSummary();
  if(t==='racks') renderRacks();
  if(t==='users') renderUsers();
});

async function boot(){
  const saved=await loadSaved();
  if(saved&&saved.racks) S={inv:{},locks:{},notes:{},kinds:{},labels:{},catLines:[],...saved};
  S.kinds=S.kinds||{}; S.labels=S.labels||{}; S.catLines=S.catLines||[];
  applyOfficialColors();
  // Only an administrator may seed the rack sheets; a scanner's copy would be
  // reverted by the server anyway, so it is not attempted.
  const added = isAdmin() ? seedSheets() : [];
  if(added.length) save();
  active=S.brands[0]?.name||null;
  const rks=Object.keys(S.racks);
  if(rks.length&&rks.every(isLocked)) $('#locktoggle').textContent='Unlock every rack';
  $('#qtytoggle').checked=showQty;
  syncTool(); renderRail(); renderMap();
}

/* Wire the door, then either resume a session or show it. */
document.getElementById('gateGo').onclick=doSignIn;
['loginUser','loginPass','suToken','suName'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') doSignIn(); });
});
document.getElementById('btnOut').onclick=()=>signOut();
document.getElementById('btnPass').onclick=changeOwnPassword;

async function changeOwnPassword(){
  const cur=prompt('Current password'); if(cur===null) return;
  const next=prompt('New password — at least 8 characters, with a number'); if(next===null) return;
  try{
    await api('/api/auth',{method:'POST',
      body:JSON.stringify({action:'change-password',currentPassword:cur,newPassword:next})});
    toast('Password changed');
  }catch(e){ alert(e.message); }
}

(async ()=>{
  if(!SESSION){ await showGate(); return; }
  try{
    const r=await fetch('/api/auth',{cache:'no-store',headers:{'x-session':SESSION}});
    const info=await r.json();
    ROLES=info.roles||[];
    if(!info.signedIn){ signOut(); return; }
    ME=info.user;
    await enterApp();
  }catch{ signOut(); }
})();
</script>
