<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouse Brand Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  /* Reorder's palette, carried over so the two tools read as one product. */
  --porcelain:#f5f3f0; --card:#fff; --line:#e6e2dd; --line-2:#cfc9c2;
  --ink:#1f2124; --ink-2:#55585d; --ink-3:#8a8d92;
  --king:#e53e30; --king-deep:#b52a1e; --king-soft:#fdecea;
  --sun:#ffaa62; --grey:#a8a8aa;
  --jade:#1a6f4c; --jade-soft:#e4f0ea;
  --brass:#a2700f; --brass-soft:#faf0dc;
  --terra:#9e3122; --terra-soft:#fbeae7;
  --sans:'Archivo',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* Aliases: the rack map's own CSS (left exactly as it was) is written
     against these older names, so it inherits the new palette automatically
     without any of its selectors needing to change. */
  --floor:var(--porcelain); --floor-2:var(--card);
  --chrome:var(--ink); --chrome-2:#2c3036;
  --sii-sun:var(--sun); --sii-red:var(--king); --sii-stone:var(--grey);
  --line-hard:var(--line-2);
  --tape:var(--king);
  --void:#d9d4cb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--porcelain);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:250px;flex:0 0 250px;
  background:linear-gradient(180deg,#ff9a5a 0%,#f47a45 38%,#e8543a 72%,#dd3f2c 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.brandbar{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.28)}
.brandrow{display:flex;align-items:center;gap:10px}
.brandlogo{height:34px;width:auto;max-width:150px;object-fit:contain;display:block}
.brandtile{width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);align-items:center;justify-content:center;
  font:600 12px var(--sans);letter-spacing:.04em;color:#fff}
.brandwords{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brandwords strong{font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandwords span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.82)}
.brandbar p{margin:5px 0 0;font-size:11px;color:rgba(255,255,255,.82);font-family:var(--mono)}

.railscroll{flex:1;overflow-y:auto;padding:14px 12px 24px}
.sec{margin-bottom:18px}
.sec>h2{margin:0 0 8px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.sec>h2 span{font-family:var(--mono);letter-spacing:0;text-transform:none;color:rgba(255,255,255,.6)}

/* brand chips: same shape as a Reorder nav button, with a colour swatch
   standing in for the dot, and the active state as a solid white chip. */
.chip{display:flex;align-items:center;gap:6px;width:100%;padding:8px 9px;margin-bottom:2px;background:transparent;border:0;border-radius:7px;text-align:left;color:rgba(255,255,255,.92);transition:background .12s,color .12s}
.chip:hover{background:rgba(255,255,255,.16);color:#fff}
.chip.on{background:#fff;color:var(--king-deep);font-weight:600}
.chip.on .nm{color:var(--king-deep)}
.chip .sw{width:13px;height:13px;flex:0 0 13px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.chip .nm{flex:1 1 auto;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ct{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.75)}
.chip.on .ct{color:var(--king-deep);opacity:.7}
.chip kbd{flex:0 0 auto;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:0 3px}
.chip:hover kbd{display:none}
.chip .del{width:17px;height:17px;flex:0 0 17px;border:0;background:transparent;color:rgba(255,255,255,.85);border-radius:4px;
  font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.chip:hover .del{display:flex}
.chip.on .del{color:var(--king-deep)}
.chip .del:hover{background:var(--king);color:#fff}
.chip.on .del:hover{background:var(--king);color:#fff}

.railbtn{width:100%;appearance:none;padding:8px 9px;background:rgba(0,0,0,.10);border:1px solid rgba(255,255,255,.28);border-radius:7px;color:#fff;font:500 12.5px var(--sans);text-align:left;margin-bottom:4px;transition:background .12s}
.railbtn:hover{background:rgba(0,0,0,.22)}
.railbtn.warn:hover{background:rgba(0,0,0,.22);border-color:#fff}

.tool{display:flex;gap:4px;margin-bottom:8px}
.tool button{flex:1;padding:6px 4px;background:rgba(0,0,0,.10);border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.85);font:500 11px var(--sans);border-radius:6px}
.tool button:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.tool button.on{background:#fff;border-color:#fff;color:var(--king-deep);font-weight:600}

.mini{font-size:11px;color:rgba(255,255,255,.78);line-height:1.5;margin:6px 0 0}

/* ---------- topbar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:0 20px;height:58px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 58px}
.tabs{display:flex;gap:3px}
.tabs button{appearance:none;padding:7px 13px;background:transparent;border:0;border-radius:7px;font:500 13px var(--sans);color:var(--ink-2);transition:background .12s,color .12s}
.tabs button:hover{background:var(--porcelain);color:var(--ink)}
.tabs button.on{background:var(--king);color:#fff}
.spacer{flex:1}
.stat{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.stat b{color:var(--ink);font-weight:600}
.savestate{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap}
.savestate.saved{color:var(--jade);background:var(--jade-soft)}
.savestate.saving{color:var(--brass);background:var(--brass-soft)}
.savestate.dirty{color:var(--brass);background:var(--brass-soft)}
.savestate.error{color:var(--terra);background:var(--terra-soft);border-color:var(--terra)}
.savestate.local{color:var(--ink-2);background:var(--porcelain);border-color:var(--line-2)}

/* ---------- the door ---------- */
.gate{max-width:392px;margin:9vh auto 0;padding:0 20px;text-align:center}
.gate.hidden{display:none}
.gate-logo{height:52px;width:auto;max-width:230px;object-fit:contain;margin:0 auto 18px;display:block}
.gate-mark{width:56px;height:56px;margin:0 auto 18px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;font:600 19px var(--sans);color:#fff;letter-spacing:.04em;
  background:linear-gradient(160deg,#ff9a5a,#dd3f2c)}
.gate h1{font-size:29px;letter-spacing:-.025em;margin-bottom:6px}
.gate-sub{color:var(--ink-2);font-size:14px;margin:0 0 26px}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:26px 24px;text-align:left;box-shadow:0 1px 2px rgba(31,33,36,.04)}
.gate-card label{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:7px}
.gate-card input{width:100%;padding:11px 13px;font-size:15px;border:1px solid var(--line-2);
  border-radius:7px;background:#fff}
.gate-card input:focus{outline:2px solid var(--king);outline-offset:-1px;border-color:var(--king)}
.gate-foot{margin:24px 0 40px;font-size:12.5px;color:var(--ink-3)}
.app.hidden{display:none}
/* A scanner reads the map; the editing furniture is not theirs. */
body.scanner #toolsec,
body.scanner #addbrand,
body.scanner #recolor,
body.scanner #reset,
body.scanner #locktoggle,
body.scanner #loadsheets,
body.scanner #loadold,
body.scanner .chip .del{display:none!important}
body.scanner .cell{cursor:default}
.find{width:150px;padding:7px 10px;border:1px solid var(--line-2);border-radius:7px;background:#fff;font-family:var(--mono);font-size:12px}
.find:focus{outline:2px solid var(--king);outline-offset:-1px;border-color:var(--king)}

/* ---------- canvas ---------- */
.canvas{flex:1;overflow:auto;padding:18px 18px 90px}
.rack{margin-bottom:22px;background:var(--floor-2);border:1px solid var(--line-hard);border-radius:4px;overflow:hidden}
.rackhead{display:flex;align-items:center;gap:10px;padding:7px 11px;background:#dedbd3;border-bottom:1px solid var(--line-hard)}
.rackhead .rid{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.04em}
.rackhead .meta{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.rackhead .acts{margin-left:auto;display:flex;gap:5px}
.rackhead .acts button{padding:3px 8px;font-size:11px;background:#fff;border:1px solid var(--line-hard);border-radius:3px;color:var(--ink-2)}
.rackhead .acts button:hover{border-color:var(--ink);color:var(--ink)}
.gridwrap{overflow-x:auto;padding:10px 11px 12px}
.grid{display:grid;gap:2px;width:max-content;user-select:none}

.hcell,.lcell{font-family:var(--mono);font-size:10px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.hcell{height:17px;letter-spacing:.02em}
.hcell.clickable:hover{color:var(--ink);text-decoration:underline;cursor:pointer}
.lcell{width:34px;justify-content:flex-end;padding-right:7px}
.lcell.clickable:hover{color:var(--ink);text-decoration:underline;cursor:pointer}

.cell{position:relative;height:40px;border:1px solid var(--line);border-radius:2px;background:#fff;overflow:hidden;cursor:crosshair;display:flex;align-items:center;justify-content:center}
.cell .tag{position:relative;font-family:var(--mono);font-size:9px;line-height:1.15;text-align:center;padding:0 2px;pointer-events:none;letter-spacing:.02em}
.cell .pos{position:absolute;top:1px;left:3px;font-family:var(--mono);font-size:8px;color:rgba(0,0,0,.3);pointer-events:none}
.cell.void{background:var(--void);border-color:#bcb8ad;cursor:not-allowed;
  background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(0,0,0,.055) 5px 10px)}
.cell.void .pos{color:rgba(0,0,0,.22)}
.cell.hit{outline:2px solid var(--tape);outline-offset:-2px}
.cell.sel{outline:2px solid var(--chrome);outline-offset:-2px}
.cell.dim{opacity:.22}
body.structure .cell{cursor:pointer}

/* ---------- panels ---------- */
.panel{padding:22px 26px 90px;overflow:auto;max-width:1600px}
.panel h2{font-size:19px;margin:0 0 5px}
.panel p.lead{margin:0 0 16px;color:var(--ink-2);font-size:13.5px;line-height:1.55;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 9px;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
textarea{width:100%;min-height:190px;padding:9px 11px;border:1px solid var(--line-2);border-radius:7px;background:#fff;font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical}
textarea:focus{outline:2px solid var(--king);outline-offset:-1px;border-color:var(--king)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:400}
select,input[type=text],input[type=number],input[type=file]{padding:7px 10px;border:1px solid var(--line-2);border-radius:7px;background:#fff;font:14px var(--sans)}
select:focus,input:focus{outline:2px solid var(--king);outline-offset:-1px;border-color:var(--king)}
.btn{appearance:none;border:1px solid var(--king);background:var(--king);color:#fff;
  padding:8px 15px;border-radius:7px;font:500 13px var(--sans);cursor:pointer;transition:background .12s}
.btn:hover{background:var(--king-deep);border-color:var(--king-deep)}
.btn.ghost{background:#fff;color:var(--king)}
.btn.ghost:hover{background:var(--king-soft)}
.btn.quiet{background:#fff;color:var(--ink-2);border-color:var(--line-2)}
.btn.quiet:hover{background:var(--porcelain);border-color:var(--ink-3)}
.log{margin-top:11px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap;border-left:3px solid var(--king);padding-left:11px}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--card)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover td{background:#faf7f4}
.bar{height:5px;border-radius:99px;min-width:2px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;font-family:var(--mono)}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--brass-soft);color:var(--brass)}
.pill.bad{background:var(--terra-soft);color:var(--terra)}

/* Bulk upload, in the Reorder idiom: sheet picker, then a manifest showing
   what each column was bound to, with every binding overridable. */
.manifest{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin-top:14px}
.manifest-head{background:var(--porcelain);border-bottom:1px solid var(--line-2);padding:10px 14px;
  display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.manifest-head .sheet{font-family:var(--mono);font-size:12.5px;font-weight:500}
.manifest-head .count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.manifest-body{padding:6px 14px 12px}
.maprow{display:grid;grid-template-columns:1fr 18px 1fr;gap:10px;align-items:center;
  padding:6px 0;border-bottom:1px dashed var(--line)}
.maprow:last-child{border-bottom:0}
.maprow .from{font-family:var(--mono);font-size:12px;color:var(--ink)}
.maprow .arrow{color:var(--ink-3);text-align:center;font-size:12px}
.maprow select{padding:5px 8px;font-size:13px;border-radius:6px}
.note{border-left:3px solid var(--line-2);padding:9px 0 9px 13px;margin:12px 0;
  font-size:13.5px;color:var(--ink-2)}
.note.warn{border-left-color:var(--brass);background:var(--brass-soft);padding-right:13px;color:var(--brass)}
.note.bad{border-left-color:var(--terra);background:var(--terra-soft);padding-right:13px;color:var(--terra)}
.note.ok{border-left-color:var(--jade);background:var(--jade-soft);padding-right:13px;color:var(--jade)}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0}
.stats div span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:3px}
.stats strong{font-family:var(--mono);font-weight:500;font-size:21px;font-variant-numeric:tabular-nums}
.cap{max-height:470px;overflow-y:auto}

.cell .qty{position:absolute;bottom:1px;right:3px;font-family:var(--mono);font-size:9px;font-weight:700;color:rgba(0,0,0,.55);pointer-events:none}
.cell.hasinv{box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.rack.locked{border-color:#9aa0a6;background:#eceae3}
.rack.locked .rackhead{background:#d5d2c9}
.rack.locked .gridwrap{position:relative}
.rack.locked .cell{cursor:not-allowed}
.rackhead .acts button.lockbtn.on{background:var(--sii-sun);border-color:#d98b45;color:#2a1a0c;font-weight:650}
.rackhead .acts button:disabled{opacity:.4;cursor:not-allowed}

.tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--chrome);color:#e9e7e1;border-radius:6px;padding:11px 14px;
  min-width:340px;max-width:560px;
  box-shadow:0 8px 26px rgba(0,0,0,.34);font-size:12px;line-height:1.5}
.tip table{width:100%;table-layout:auto}
.tip.show{opacity:1}
.tip .tloc{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em}
.tip .tbr{margin-top:2px;display:flex;gap:5px;flex-wrap:wrap}
.tip .tbr span{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.04em}
.tip .tbr i{width:8px;height:8px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.tip table{margin-top:7px;border-top:1px solid #363d44;font-size:11px}
.tip th,.tip td{border-bottom:1px solid #262c32;padding:4px 14px 4px 0;color:#cfcdc7;
  white-space:nowrap;font-size:12px}
.tip th{color:#7f868e;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.tip td:first-child,.tip th:first-child{width:99%;white-space:normal;word-break:break-all}
.tip td.num,.tip th.num{text-align:right;font-family:var(--mono);padding-right:0}
.tip .tot{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--sii-sun)}
.tip .none{margin-top:6px;color:#7f868e;font-style:italic}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpis.tight{margin-bottom:0}
.kpi{background:var(--floor-2);border:1px solid var(--line-hard);border-radius:4px;padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.kpi .k-l{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.kpi .k-v{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.15}
.kpi .k-s{font-size:11px;color:var(--ink-2)}
.meter{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line-hard);background:#fff}
.meter span{display:block;height:100%}
.meter .rest,.bar.hatch,.dot.hatch{background:#fff;
  background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.16) 4px 8px)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);vertical-align:baseline}
.scanbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}
.scanbar select,.scanbar input{width:100%}
@media (max-width:1180px){.scanbar{grid-template-columns:repeat(3,1fr)}}
.unitpick{display:flex;gap:4px}
.unitpick button{flex:1;padding:9px 4px;border:1px solid var(--line-2);background:#fff;
  border-radius:7px;font:500 12.5px var(--sans);color:var(--ink-2)}
.unitpick button.on{background:var(--king);border-color:var(--king);color:#fff}
@media (max-width:900px){.scanbar{grid-template-columns:1fr 1fr}}
.tip .none{margin-top:6px;color:#7f868e;font-style:italic}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.fld input{padding:9px 10px;border:1px solid var(--line-hard);border-radius:3px;background:#fff;font-family:var(--mono);font-size:15px}
.fld input:focus{outline:2px solid var(--sii-sun);outline-offset:-1px;border-color:var(--sii-sun)}
#s-code{font-size:18px;letter-spacing:.04em}
.hit-card{margin-top:14px;border:1px solid var(--line-hard);border-radius:4px;padding:13px 15px;background:#fff}
.hit-card.miss{background:#fdf0ee;border-color:var(--sii-red)}
.hit-card.warn{background:#fff8ee;border-color:#d98b45}
.hit-sku{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.02em}
.hit-meta{margin-top:3px;font-size:12px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hit-note{margin-top:9px;font-size:12px;padding:7px 10px;border-radius:3px;background:#fff3e3;border-left:3px solid #d98b45}
.hit-card.miss .hit-note{background:#fbe3e0;border-left-color:var(--sii-red)}
.big{font-family:var(--mono);font-size:20px;font-weight:700}
.scanlog{max-height:340px;overflow:auto}
.scanlog tr.new td{animation:flash 1.1s ease-out}
@keyframes flash{from{background:#ffe9d1}to{background:transparent}}

<script>
/* ============================================================
   Storage adapter — Vercel Blob, via /api/state.

   The whole map is one JSON document. Reads and writes go through
   a single serverless function; nothing else in this file touches
   persistence. Saves are debounced, and the indicator in the top
   bar is the only place that reports on them.
   ============================================================ */
/* ============================================================
   Session and storage.

   Everything server-side goes through api(), which attaches the
   session token and bounces back to the sign-in screen the moment
   the server says the session is gone.
   ============================================================ */
let SESSION = sessionStorage.getItem('wh-session') || '';
let ME = null;
let ROLES = [];
const isAdmin = () => ME?.role === 'admin';

async function api(path, opts = {}) {
  const r = await fetch(path, {
    cache: 'no-store',
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-session': SESSION, ...(opts.headers || {}) }
  });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 && body.reauth) { signOut('Your session expired. Sign in again.'); throw new Error('Session expired'); }
  if (!r.ok) throw new Error(body.error || `Request failed (${r.status})`);
  return body;
}

async function loadSaved(){
  try{
    const j = await api('/api/state');
    saveState('saved');
    return j.state || null;
  }catch(e){
    saveState('error', e.message);
    return null;
  }
}

let saveTimer=null, saving=false, pending=false;
function save(){
  clearTimeout(saveTimer);
  saveState('dirty');
  saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(saving){ pending=true; return; }
  saving=true;
  saveState('saving');
  try{
    const out = await api('/api/state', { method:'PUT', body: JSON.stringify(S) });
    // The server reverts anything a scanner is not allowed to change, and says
    // which parts. Silently accepting the write would leave the screen showing
    // edits that were never stored.
    if(out.guarded && out.guarded.length){
      saveState('saved');
      toast('Saved, but rack layout changes were not — that needs an administrator.');
      const fresh = await api('/api/state');
      if(fresh.state){ S = fresh.state; commitLocal(); }
    } else saveState('saved');
  }catch(e){
    saveState('error', e.message);
  }finally{
    saving=false;
    if(pending){ pending=false; flush(); }
  }
}
/** Redraw from S without writing back. */
function commitLocal(){ renderRail(); renderMap(); renderSummary(); }

window.addEventListener('beforeunload',e=>{
  const dirty=document.getElementById('savestate')?.dataset.s==='dirty';
  if(dirty||(typeof scanPending!=='undefined'&&scanPending.length)){ e.preventDefault(); e.returnValue=''; }
});

function saveState(st,msg){
  const el=document.getElementById('savestate');
  if(!el) return;
  el.dataset.s=st;
  el.textContent = st==='saved' ? 'Saved' : st==='saving' ? 'Saving…'
    : st==='dirty' ? 'Unsaved' : 'Not saved';
  el.title = msg || (st==='error' ? 'The last save failed.' : '');
  el.className = 'savestate ' + st;
}

/* ------------------------------ the door ---------------------------- */
let setupMode = false;

function gateError(msg){
  const e=document.getElementById('gateErr');
  e.textContent=msg; e.classList.remove('hidden');
}

async function showGate(){
  document.querySelector('.app').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  try{
    const r = await fetch('/api/auth', { cache:'no-store', headers:{ 'x-session': SESSION } });
    const info = await r.json();
    ROLES = info.roles || [];
    setupMode = Boolean(info.needsSetup);
    if(info.error) gateError(info.error);
  }catch{ setupMode=false; }
  document.getElementById('setupFields').classList.toggle('hidden', !setupMode);
  document.getElementById('gateTitle').textContent = setupMode ? 'First-time setup' : 'Warehouse';
  document.getElementById('gateLede').textContent = setupMode
    ? 'Choose the administrator user ID and password.' : 'Rack map and inventory';
  document.getElementById('passLabel').textContent = setupMode ? 'Choose a password' : 'Password';
  document.getElementById('gateGo').textContent = setupMode ? 'Create administrator' : 'Sign in';
  document.getElementById('loginUser').focus();
}

function signOut(message){
  SESSION=''; ME=null;
  sessionStorage.removeItem('wh-session');
  showGate().then(()=>{ if(message) gateError(message); });
}

async function doSignIn(){
  document.getElementById('gateErr').classList.add('hidden');
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  if(!username||!password){ gateError('Enter a user ID and password.'); return; }
  const btn=document.getElementById('gateGo');
  btn.disabled=true;
  try{
    const body = setupMode
      ? { action:'bootstrap', setupToken:document.getElementById('suToken').value,
          username, password, name:document.getElementById('suName').value }
      : { action:'login', username, password };
    const r=await fetch('/api/auth',{ method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const out=await r.json().catch(()=>({}));
    if(!r.ok){ gateError(out.error||`Sign-in failed (${r.status})`); return; }
    SESSION=out.token; ME=out.user; ROLES=out.roles||ROLES;
    sessionStorage.setItem('wh-session',SESSION);
    document.getElementById('loginPass').value='';
    await enterApp();
  }catch(e){ gateError(e.message); }
  finally{ btn.disabled=false; }
}

/** Which tabs each role may open. The server enforces the rest. */
const TAB_ROLES = { racks:'admin', users:'admin' };

async function enterApp(){
  document.getElementById('gate').classList.add('hidden');
  document.querySelector('.app').classList.remove('hidden');
  document.getElementById('whoName').textContent = ME?.name || ME?.username || '';
  document.getElementById('whoRole').textContent =
    (ROLES.find(r=>r.id===ME?.role)?.label || ME?.role || '').toUpperCase();

  let first=null;
  document.querySelectorAll('.tabs button').forEach(b=>{
    const need=TAB_ROLES[b.dataset.tab];
    const ok = !need || ME?.role===need;
    b.style.display = ok ? '' : 'none';
    if(ok && !first) first=b;
  });
  // A scanner reads the map but does not paint it, so the whole tool section
  // and the brand add/delete controls go away rather than failing on save.
  document.body.classList.toggle('scanner', !isAdmin());

  await boot();
  if(first) first.click();
}

/* Adds a transcribed rack only if it isn't already in the map, so
   nothing you've edited by hand gets overwritten. */
function seedSheets(){
  let added=[];
  for(const r in SHEETS){
    if(S.racks[r]) continue;
    S.racks[r]=SHEETS[r].racks();
    if(SHEETS[r].kind) S.kinds[r]=SHEETS[r].kind;
    if(SHEETS[r].label) S.labels[r]=SHEETS[r].label;
    for(const k in SHEETS[r].note) S.assign[r+k]=SHEETS[r].note[k].slice();
    added.push(r);
  }
  return added;
}
function freshState(){
  return {racks:{}, brands:SEED_BRANDS.map(b=>({...b})), assign:{}, inv:{}, locks:{}, notes:{}, kinds:{}, labels:{}, catLines:[]};
}

/* Official brand colours always win over whatever an older save held.
   Brands added by hand keep their own colour. */
function applyOfficialColors(){
  if(!S.brands) S.brands=[];
  SEED_BRANDS.forEach(seed=>{
    const hit=S.brands.find(b=>b.name.toUpperCase()===seed.name);
    if(hit) hit.color=seed.color; else S.brands.push({...seed});
  });
}

(function(){
  for(const ln of CAT_RAW.split('\n')){
    if(!ln) continue;
    const [c,sku,pk,bi]=ln.split('|');
    const code=c?(c[0]==='~'?'9780201'+c.slice(1):c):'';
    const rec={code,sku,packing:pk?+pk:null,brand:bi!==''&&bi!=null?CAT_BRANDS[+bi]:''};
    CAT.push(rec);
    if(code&&!BY_CODE.has(code)) BY_CODE.set(code,rec);
    const k=sku.toUpperCase();
    if(!BY_SKU.has(k)) BY_SKU.set(k,rec);
  }

/**
 * Find a SKU from whatever was scanned or typed.
 *
 * `matched` says which barcode it was — 'box', 'item' or 'sku' — because that
 * decides whether the number entered means cartons or loose pieces. Box is
 * checked first: a box barcode is the one a picker is most likely to be
 * pointing at, and getting it backwards multiplies the count by the pack size.
 */
function lookup(raw){
  let q=String(raw||'').trim();
  if(!q) return null;
  const digits=q.replace(/\D/g,'');
  if(S.catLines&&S.catLines.length){
    if(digits){
      const byBox=S.catLines.find(l=>l.boxUpc&&l.boxUpc===digits);
      if(byBox) return {sku:byBox.sku,packing:byBox.packing,brand:byBox.brand,matched:'box'};
      const byUpc=S.catLines.find(l=>l.upc&&l.upc===digits);
      if(byUpc) return {sku:byUpc.sku,packing:byUpc.packing,brand:byUpc.brand,matched:'item'};
    }
    const bySku=S.catLines.find(l=>(l.sku||'').toUpperCase()===q.toUpperCase());
    if(bySku) return {sku:bySku.sku,packing:bySku.packing,brand:bySku.brand,matched:'sku'};
  }
  if(digits&&BY_CODE.has(digits)) return BY_CODE.get(digits);
  // some scanners drop or add a leading zero on 12/13-digit codes
  if(digits){
    if(BY_CODE.has('0'+digits)) return BY_CODE.get('0'+digits);
    if(digits[0]==='0'&&BY_CODE.has(digits.slice(1))) return BY_CODE.get(digits.slice(1));
  }
  return BY_SKU.get(q.toUpperCase())||null;
}

let S=freshState();
let mode='paint', active=null, painting=false, hiddenRacks={}, query='', selected=null;
const FALLBACK=['#0f766e','#9333ea','#c2410c','#0369a1','#4d7c0f','#9f1239','#374151','#b91c1c'];
let showQty=true;

const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const brandOf=n=>S.brands.find(b=>b.name===n);
const colorOf=n=>{const b=brandOf(n);return b?b.color:'#94a3b8';};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function abbr(n){
  const w=n.replace(/'/g,'').split(/[\s\-_]+/).filter(Boolean);
  if(w.length===1) return w[0].slice(0,7);
  return w.map(x=>x[0]).join('').slice(0,4);
}
function readable(hex){
  const c=hex.replace('#','');
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (r*299+g*587+b*114)/1000>150 ? '#14181c' : '#ffffff';
}
const isLocked=r=>!!(S.locks&&S.locks[r]);
const isFloor=r=>(S.kinds&&S.kinds[r])==='floor';
const rackName=r=>(S.labels&&S.labels[r])||('RACK '+r);
/* A floor area sits beside the rack of the same letter, so it sorts
   immediately after that rack rather than in a block at the end. */
const baseOf=r=>r.startsWith('LC')?r.slice(2):r;
function sortRacks(a,b){
  const ba=baseOf(a), bb=baseOf(b);
  if(ba!==bb) return ba.length-bb.length||ba.localeCompare(bb);
  return (a.length-b.length);
}
const besideRack=r=>isFloor(r)?baseOf(r):null;
/* pallet bays of the floor area attached to rack r, if it is showing */
function palOf(r){
  const p='LC'+r;
  if(isFloor(r)||!S.racks[p]||hiddenRacks[p]) return [];
  return Object.keys(S.racks[p]).map(Number).sort((a,b)=>a-b);
}
/* a floor area is drawn inside its parent rack, so it gets no block of its own */
const attached=r=>isFloor(r)&&!!S.racks[baseOf(r)]&&!hiddenRacks[baseOf(r)];
function invOf(loc){ return (S.inv&&S.inv[loc])||[]; }
function qtyOf(loc){ return invOf(loc).reduce((a,x)=>a+(+x.qty||0),0); }
function boxesOf(loc){ return invOf(loc).reduce((a,x)=>a+(+x.boxes||0),0); }
function allSlots(){
  const out=[];
  for(const r of Object.keys(S.racks).sort(sortRacks)){
    for(const b of Object.keys(S.racks[r]).sort((x,y)=>x-y))
      for(const l of S.racks[r][b]) out.push({rack:r,bay:+b,layer:l,loc:r+b+'.'+l});
  }
  return out;
}

/* ============================================================
   Left rail
   ============================================================ */
function renderRail(){
  const slots=allSlots();
  const used=slots.filter(s=>(S.assign[s.loc]||[]).length).length;
  $('#subtitle').textContent=`${slots.length} slots · ${used} assigned`;
  $('#brandcount').textContent=S.brands.length;

  const counts={};
  for(const loc in S.assign) for(const n of S.assign[loc]) counts[n]=(counts[n]||0)+1;

  const p=$('#palette'); p.innerHTML='';
  S.brands.forEach((b,i)=>{
    const btn=el('button','chip'+(active===b.name?' on':''));
    const sw=el('span','sw'); sw.style.background=b.color;
    const nm=el('span','nm'); nm.textContent=b.name; nm.title=b.name;
    const ct=el('span','ct'); ct.textContent=counts[b.name]||0;
    btn.append(sw,nm,ct);
    if(i<9){const k=el('kbd');k.textContent=i+1;btn.append(k);}
    const del=el('button','del'); del.textContent='×';
    del.title='Delete '+b.name;
    del.onclick=e=>{ e.stopPropagation(); deleteBrand(b); };
    btn.append(del);
    btn.onclick=()=>{ active=b.name; mode='paint'; syncTool(); renderRail(); };
    btn.oncontextmenu=e=>{e.preventDefault(); editBrand(b);};
    p.append(btn);
  });

  const rf=$('#rackfilter'); rf.innerHTML='';
  const racks=Object.keys(S.racks).sort(sortRacks);
  if(!racks.length){ rf.innerHTML='<p class="mini">No racks yet. Add one in Rack setup.</p>'; }
  racks.forEach(r=>{
    const btn=el('button','railbtn');
    const n=Object.values(S.racks[r]).reduce((a,x)=>a+x.length,0);
    const done=Object.keys(S.racks[r]).reduce((a,b)=>a+S.racks[r][b].filter(l=>(S.assign[r+b+'.'+l]||[]).length).length,0);
    btn.innerHTML=`<span style="opacity:${hiddenRacks[r] ? 0.45 : 1}">${isFloor(r)?rackName(r):'Rack '+r}</span>
      <span style="float:right;font-family:var(--mono);font-size:11px;color:#868d95">${done}/${n}</span>`;
    btn.onclick=()=>{hiddenRacks[r]=!hiddenRacks[r]; renderRail(); renderMap();};
    rf.append(btn);
  });
}
function syncTool(){
  document.querySelectorAll('.tool button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  document.body.classList.toggle('structure',mode==='structure');
}

function renderMap(){
  const c=$('#canvas'); c.innerHTML='';
  const racks=Object.keys(S.racks).sort(sortRacks).filter(r=>!hiddenRacks[r]&&!attached(r));
  if(!racks.length){ c.innerHTML='<p style="color:var(--ink-2)">Every rack is hidden, or none exist yet. Turn racks back on in the left rail.</p>'; return; }
  racks.forEach(r=>c.append(rackEl(r)));
}
function rackEl(r){
  const bays=Object.keys(S.racks[r]).map(Number).sort((a,b)=>a-b);
  const maxBay=Math.max(...bays,1);
  const total=bays.reduce((a,b)=>a+S.racks[r][b].length,0);
  const done=bays.reduce((a,b)=>a+S.racks[r][b].filter(l=>(S.assign[r+b+'.'+l]||[]).length).length,0);

  const wrap=el('div','rack');
  const locked=isLocked(r);
  if(locked) wrap.classList.add('locked');
  const head=el('div','rackhead');
  const pcs=bays.reduce((a,b)=>a+S.racks[r][b].reduce((x,l)=>x+qtyOf(r+b+'.'+l),0),0);
  const floor=isFloor(r);
  if(floor) wrap.classList.add('floorarea');
  head.innerHTML=`<span class="rid">${rackName(r)}</span>
    <span class="meta">${floor
      ? `${total} pallet position${total===1?'':'s'} · ${done} assigned`
      : `${maxBay} bays · ${total} slots · ${done} assigned`}${pcs?` · ${pcs.toLocaleString()} pcs`:''}${
        floor&&S.racks[besideRack(r)]?` · beside Rack ${besideRack(r)}`:''}${
        palOf(r).length?` · ${palOf(r).length} floor pallet${palOf(r).length===1?'':'s'}`:''}</span>`;
  const acts=el('div','acts');
  const lock=el('button','lockbtn'+(locked?' on':''));
  lock.textContent = locked ? 'Locked' : 'Lock rack';
  lock.title = locked ? 'Unlock to allow edits' : 'Stop this being changed by mistake';
  lock.onclick=()=>{ S.locks[r]=!locked; commit(); toast(`${rackName(r)} ${locked?'unlocked':'locked'}`); };
  const fill=el('button'); fill.textContent=floor?'Fill area':'Fill rack'; fill.disabled=locked;
  fill.onclick=()=>{ if(locked) return toast(`${rackName(r)} is locked`);
    if(!active&&mode!=='erase') return toast('Pick a brand first');
    bays.forEach(b=>S.racks[r][b].forEach(l=>apply(r+b+'.'+l))); commit(); };
  const clr=el('button'); clr.textContent=floor?'Clear area':'Clear rack'; clr.disabled=locked;
  clr.onclick=()=>{ if(locked) return toast(`${rackName(r)} is locked`);
    if(!confirm(`Clear every brand on ${rackName(r)}?`)) return;
    bays.forEach(b=>S.racks[r][b].forEach(l=>delete S.assign[r+b+'.'+l])); commit(); };
  acts.append(lock,fill,clr); head.append(acts); wrap.append(head);

  const gw=el('div','gridwrap');
  const g=el('div','grid');
  const palBays = palOf(r);
  const pal = palBays.length ? 'LC'+r : null;
  g.style.gridTemplateColumns=`34px repeat(${maxBay},${floor?96:58}px)`
    + (pal?` 14px repeat(${palBays.length},82px)`:'');

  g.append(el('div','hcell'));
  for(let b=1;b<=maxBay;b++){
    const h=el('div','hcell clickable'); h.textContent=b;
    h.title='Apply to the whole bay';
    h.onclick=()=>{ if(!S.racks[r][b]) return;
      if(isLocked(r)) return toast(`${rackName(r)} is locked`);
      S.racks[r][b].forEach(l=>apply(r+b+'.'+l)); commit(); };
    g.append(h);
  }
  if(pal){
    g.append(el('div','gap'));
    palBays.forEach(b=>{
      const h=el('div','hcell pal'); h.textContent='PLT '+b;
      h.title=`Floor pallet ${pal}${b}.1 — low ceiling, beside Rack ${r}`;
      g.append(h);
    });
  }
  const layers = floor ? [1] : [4,3,2,1];
  layers.forEach(l=>{
    const lc=el('div','lcell clickable'); lc.textContent=floor?'PLT':('L'+l);
    lc.title='Apply to the whole layer';
    lc.onclick=()=>{ if(isLocked(r)) return toast(`${rackName(r)} is locked`);
      bays.forEach(b=>{ if(S.racks[r][b].includes(l)) apply(r+b+'.'+l); }); commit(); };
    g.append(lc);
    for(let b=1;b<=maxBay;b++) g.append(cellEl(r,b,l));
    if(pal){
      g.append(el('div','gap'));
      palBays.forEach(b=>{
        if(l===1){ const c=cellEl(pal,b,1); c.classList.add('pltcell'); g.append(c); }
        else g.append(el('div','nocell'));
      });
    }
  });
  gw.append(g); wrap.append(gw);
  return wrap;
}
function cellEl(r,b,l){
  const loc=r+b+'.'+l;
  const exists=S.racks[r][b]&&S.racks[r][b].includes(l);
  const d=el('div','cell'+(exists?'':' void'));
  d.dataset.loc=loc; d.dataset.rack=r; d.dataset.bay=b; d.dataset.layer=l;
  const pos=el('span','pos'); pos.textContent=b+'.'+l; d.append(pos);

  if(exists){
    const list=S.assign[loc]||[];
    if(list.length){
      const cols=list.map(colorOf);
      d.style.background = cols.length===1 ? cols[0]
        : `linear-gradient(180deg,${cols.map((c,i)=>`${c} ${i*100/cols.length}%,${c} ${(i+1)*100/cols.length}%`).join(',')})`;
      const tag=el('span','tag');
      tag.textContent=list.map(abbr).join('·');
      tag.style.color=readable(cols[0]);
      tag.style.fontWeight='600';
      d.append(tag);
      pos.style.color = readable(cols[0])==='#ffffff' ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.38)';
    }
    const q=qtyOf(loc);
    if(q&&showQty){
      const badge=el('span','qty');
      badge.textContent=q.toLocaleString();
      if(list.length) badge.style.color=readable(colorOf(list[0]));
      d.append(badge);
      d.classList.add('hasinv');
    }
  }

  if(query){
    const list=S.assign[loc]||[];
    const hit=loc.toUpperCase()===query || list.some(n=>n.toUpperCase().includes(query));
    d.classList.toggle('hit',hit); d.classList.toggle('dim',!hit);
  }
  if(selected===loc) d.classList.add('sel');
  return d;
}

/* ============================================================
   Painting
   ============================================================ */
function apply(loc){
  if(!isAdmin()) return;
  const rk=(loc.match(/^[A-Z]+/)||[''])[0];
  if(isLocked(rk)) return;
  if(mode==='erase'){ delete S.assign[loc]; return; }
  if(mode==='structure'){ toggleSlot(loc); return; }
  if(!active) return;
  const cur=S.assign[loc]||[];
  if($('#addmode').checked){
    if(!cur.includes(active)) S.assign[loc]=[...cur,active].slice(0,3);
  } else S.assign[loc]=[active];
}
function toggleSlot(loc){
  const m=loc.match(/^([A-Z]+)(\d+)\.(\d+)$/); if(!m) return;
  const [,r,b,l]=m, L=+l;
  if(!S.racks[r]) S.racks[r]={};
  const arr=S.racks[r][b]||[];
  if(arr.includes(L)){
    S.racks[r][b]=arr.filter(x=>x!==L);
    delete S.assign[loc]; delete S.inv[loc];
    if(!S.racks[r][b].length) delete S.racks[r][b];
  } else S.racks[r][b]=[...arr,L].sort((a,b)=>a-b);
}
function commit(){ save(); renderRail(); renderMap(); renderSummary(); }

$('#canvas').addEventListener('mousedown',e=>{
  const c=e.target.closest('.cell'); if(!c) return;
  e.preventDefault();
  if(e.shiftKey){ selected=c.dataset.loc; scanLoc=c.dataset.loc; renderMap(); toast(`Scan slot set to ${scanLoc}`); return; }
  if(isLocked(c.dataset.rack)) return toast(`Rack ${c.dataset.rack} is locked`);
  if(c.classList.contains('void')&&mode!=='structure') return;
  painting=true; apply(c.dataset.loc); commit();
});
$('#canvas').addEventListener('mouseover',e=>{
  if(!painting||mode==='structure') return;
  const c=e.target.closest('.cell'); if(!c||c.classList.contains('void')) return;
  apply(c.dataset.loc); save(); renderMap();
});

const tip=$('#tip');
function tipHTML(loc){
  const list=S.assign[loc]||[], rows=invOf(loc), locked=isLocked((loc.match(/^[A-Z]+/)||[''])[0]);
  let h=`<div class="tloc">${loc}${locked?' 🔒':''}</div>`;
  h+= list.length
    ? `<div class="tbr">${list.map(n=>`<span><i style="background:${colorOf(n)}"></i>${n}</span>`).join('')}</div>`
    : `<div class="tbr"><span style="color:#7f868e">No brand assigned</span></div>`;
  if(rows.length){
    h+=`<table><thead><tr><th>SKU</th><th class="num">Boxes</th><th class="num">Pack</th><th class="num">Total</th></tr></thead><tbody>`;
    rows.slice(0,10).forEach(r=>{
      h+=`<tr><td style="font-family:var(--mono)">${esc(r.sku||'—')}</td>`
       + `<td class="num">${r.boxes!=null&&r.boxes!==''?(+r.boxes).toLocaleString():'—'}</td>`
       + `<td class="num">${r.packing!=null&&r.packing!==''?(+r.packing).toLocaleString():'—'}</td>`
       + `<td class="num">${(+r.qty||0).toLocaleString()}</td></tr>`;
    });
    h+=`</tbody></table>`;
    if(rows.length>10) h+=`<div class="none">+ ${rows.length-10} more lines</div>`;
    const bx=boxesOf(loc);
    h+=`<div class="tot">${rows.length} SKU${rows.length===1?'':'s'}${bx?` · ${bx.toLocaleString()} boxes`:''} · ${qtyOf(loc).toLocaleString()} pcs</div>`;
  } else h+=`<div class="none">No inventory recorded here</div>`;
  return h;
}
function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function placeTip(e){
  const w=tip.offsetWidth,hgt=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-10) x=e.clientX-w-16;
  if(y+hgt>innerHeight-10) y=Math.max(10,e.clientY-hgt-16);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

  if(tip.dataset.loc!==c.dataset.loc){ tip.dataset.loc=c.dataset.loc; tip.innerHTML=tipHTML(c.dataset.loc); }
  placeTip(e); tip.classList.add('show');
});

   ============================================================ */
$('#recolor').onclick=()=>{ applyOfficialColors(); commit(); toast('Official brand colours applied'); };
$('#addbrand').onclick=()=>{
  const n=prompt('Brand name')?.trim().toUpperCase(); if(!n) return;
  if(brandOf(n)) return toast('That brand already exists');
  S.brands.push({name:n,color:FALLBACK[S.brands.length%FALLBACK.length]});
  active=n; commit();
};
function deleteBrand(b){
  const hits=Object.keys(S.assign).filter(k=>S.assign[k].includes(b.name));
  const onLocked=hits.filter(k=>isLocked((k.match(/^[A-Z]+/)||[''])[0]));
  let msg=`Delete the brand ${b.name}?`;
  if(hits.length) msg+=`\n\nIt is on ${hits.length} slot${hits.length===1?'':'s'}, which will be cleared.`;
  if(onLocked.length) msg+=`\n${onLocked.length} of those sit on locked racks and will be left alone.`;
  if(!confirm(msg)) return;
  S.brands=S.brands.filter(x=>x!==b);
  hits.forEach(k=>{
    if(isLocked((k.match(/^[A-Z]+/)||[''])[0])) return;
    S.assign[k]=S.assign[k].filter(x=>x!==b.name);
    if(!S.assign[k].length) delete S.assign[k];
  });
  if(active===b.name) active=S.brands[0]?.name||null;
  commit(); syncTool();
  toast(`${b.name} deleted${onLocked.length?` — ${onLocked.length} kept on locked racks`:''}`);
}
function editBrand(b){
  const n=prompt('Rename this brand',b.name);
  if(n===null) return;
  if(!n.trim()) return deleteBrand(b);
  const c=prompt('Colour (hex)',b.color);
  const old=b.name; b.name=n.trim().toUpperCase();
  if(c&&/^#[0-9a-f]{6}$/i.test(c.trim())) b.color=c.trim();
  for(const k in S.assign) S.assign[k]=S.assign[k].map(x=>x===old?b.name:x);
  if(active===old) active=b.name;
  commit();
}

function parseLine(line){
  let t=line.trim(); if(!t) return null;
  t=t.replace(/^[•\-*\u2013]+\s*/,'');
  const m=t.match(/^([A-Z]{0,3})\s*(\d+)\s*[.\-]\s*(\d+)\s*(?:[-–:=]|\s)\s*(.*)$/i);
  if(!m) return null;
  const rest=(m[4]||'').trim();
  return {rackPrefix:(m[1]||'').toUpperCase(),bay:+m[2],layer:+m[3],raw:rest};
}
function splitBrands(s){
  return s.split(/\s*(?:&|\+|\/| AND )\s*/i).map(x=>x.trim().toUpperCase().replace(/[.,;]+$/,'')).filter(Boolean);
}

/** Slots for the chosen rack, in the order they run along the aisle. */
function drawSlotOptions(){
  const sel=$('#s-slot');
  if(!sel) return;
  const r=scanRack;

  if(r&&S.racks[r]){
    Object.keys(S.racks[r]).map(Number).sort((a,b)=>a-b).forEach(bay=>{
      S.racks[r][bay].slice().sort((a,b)=>a-b).forEach(l=>{
        const loc=`${r}${bay}.${l}`;
        const brands=(S.assign[loc]||[]).join(' & ');
        out.push(`<option value="${esc(loc)}" ${loc===scanLoc?'selected':''}>${
          esc(loc)}${brands?' — '+esc(brands):''}</option>`);
      });
    });
  }
  sel.innerHTML = out.length?out.join(''):'<option value="">no slots in this rack</option>';
  if(!scanLoc||!out.some(o=>o.includes(`value="${scanLoc}"`))) scanLoc=sel.value||'';

function showHit(html,cls){ $('#s-hit').innerHTML=`<div class="hit-card ${cls||''}">${html}</div>`; }

function setScanUnit(u,focusBack){
  scanUnit = u==='piece' ? 'piece' : 'box';
  const sel=$('#s-unit'); if(sel) sel.value=scanUnit;
  const lab=$('#s-countlabel');
  if(lab) lab.textContent = scanUnit==='box' ? 'Boxes' : 'Pieces';
  if(focusBack) $('#s-code')?.focus();
}

/**
 * Work out what a scan means and put it on the list. Deliberately does not
 * touch S.inv — everything waits for Save, so a wrong scan costs a click
 * rather than needing an undo against live data.
 */
function stageScan(raw){
  const loc=(scanLoc||'').toUpperCase();
  const m=loc.match(/^([A-Z]{1,3})(\d+)\.(\d+)$/);
  if(!m){ showHit('<div class="hit-sku">No slot chosen</div><div class="hit-meta">Pick a rack and slot above, then scan.</div>','miss'); return; }
  const rk=m[1];
  if(isLocked(rk)){ showHit(`<div class="hit-sku">${rackName(rk)} is locked</div><div class="hit-meta">Unlock it on the map before adding stock.</div>`,'miss'); return; }

  const rec=lookup(raw);
  if(!rec){
    showHit(`<div class="hit-sku">${esc(String(raw).trim())}</div>
      <div class="hit-meta">Not in the catalogue</div>
      <div class="hit-note">Nothing was added. Check the code, or add the SKU on the Catalog tab.</div>`,'miss');
    return;
  }

  if(rec.matched==='box') setScanUnit('box',false);
  else if(rec.matched==='item') setScanUnit('piece',false);

  const count=Math.max(0,parseFloat($('#s-count').value)||0);
  const packing=rec.packing;
  if(scanUnit==='box'&&packing==null){
    showHit(`<div class="hit-sku">${esc(rec.sku)}</div>
      <div class="hit-meta"><span>${esc(rec.brand||'no brand')}</span><span>no pack size on file</span></div>
      <div class="hit-note">Not added — counting boxes needs a pack size. Switch <strong>Counting</strong>
      to Pieces, or set the packing on the Catalog tab.</div>`,'miss');
    return;
  }
  if(!count){ showHit('<div class="hit-sku">Count is zero</div><div class="hit-meta">Set how many, then scan again.</div>','miss'); return; }

  const qty = scanUnit==='box' ? count*packing : count;
  scanPending.push({ loc, sku:rec.sku, brand:rec.brand, unit:scanUnit, count, packing,
    boxes: scanUnit==='box'?count:null, qty, matched:rec.matched });

  const mapped=S.assign[loc]||[];
  let note='';
  if(rec.brand&&mapped.length&&!mapped.includes(rec.brand))
    note=`<div class="hit-note">This slot is mapped to ${mapped.join(' & ')}, but the SKU is ${esc(rec.brand)}. Added anyway — worth a look.</div>`;
  else if(rec.brand&&!mapped.length)
    note=`<div class="hit-note">This slot has no brand set.</div>`;

  const pic=(catInfo(rec.sku)||{}).imageUrl;
  const card=`${pic?`<img src="${esc(pic)}" alt="" onerror="this.style.display='none'"
      style="float:right;width:64px;height:64px;object-fit:contain;border-radius:6px;
      background:#fff;border:1px solid var(--line);margin-left:12px">`:''}
    <div class="hit-sku">${esc(rec.sku)}</div>
    <div class="hit-meta">
      <span>${esc(rec.brand||'no brand')}</span>
      <span>${loc}</span>
      <span class="pill ${rec.matched==='box'?'ok':rec.matched==='item'?'warn':''}">${
        rec.matched==='box'?'box barcode':rec.matched==='item'?'item barcode':'typed SKU'}</span>
      <span class="big">${scanUnit==='box'
        ? `${count} × ${packing} = ${qty.toLocaleString()} pcs`
        : `${qty.toLocaleString()} pc${qty===1?'':'s'}`}</span>
    </div>${note}`;

  renderScan();            // redraw the waiting list
  showHit(card, note?'warn':'');
}

/** Write every waiting line to the map, in one go. */
function saveStaged(){
  if(!scanPending.length) return;
  const blocked=[];
  let written=0;

  scanPending.forEach(e=>{
    const m=e.loc.match(/^([A-Z]{1,3})(\d+)\.(\d+)$/);
    if(!m) return;
    const rk=m[1], bay=m[2], layer=+m[3];
    if(isLocked(rk)){ blocked.push(e.loc); return; }

    if(!S.racks[rk]) S.racks[rk]={};
    const arr=S.racks[rk][bay]||[];
    if(!arr.includes(layer)) S.racks[rk][bay]=[...arr,layer].sort((a,b)=>a-b);

    S.inv[e.loc]=S.inv[e.loc]||[];
    const ex=S.inv[e.loc].find(x=>x.sku===e.sku);
    if(ex){
      if(e.boxes!=null) ex.boxes=(+ex.boxes||0)+e.boxes;
      if(e.packing!=null) ex.packing=e.packing;
      ex.qty=(+ex.qty||0)+e.qty;
    } else {
      S.inv[e.loc].push({sku:e.sku,boxes:e.boxes,packing:e.packing,qty:e.qty});
    }
    savedThisSession.push({loc:e.loc,sku:e.sku,qty:e.qty});
    written++;
  });

  scanPending = blocked.length ? scanPending.filter(e=>blocked.includes(e.loc)) : [];
  commit();
  renderScan();
  const log=$('#s-savelog');
  if(log){
    log.classList.remove('hidden');
    log.textContent = `${written} line${written===1?'':'s'} saved to the map.`
      + (blocked.length?`\n${blocked.length} left waiting — ${[...new Set(blocked)].join(', ')} `
        +'is locked.':'');
  }
  toast(`${written} line${written===1?'':'s'} saved`);
}

async function toggleCam(){
  const v=$('#s-video'), btn=$('#s-cam');
  if(camStream){
    camStream.getTracks().forEach(t=>t.stop()); camStream=null;
    v.classList.add('hidden'); btn.textContent='Use camera'; return;
  }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=camStream; await v.play();
    v.classList.remove('hidden'); btn.textContent='Stop camera';
    const det=new BarcodeDetector();
    let last='', lastAt=0;
    const tick=async()=>{
      if(!camStream) return;
      try{
        const codes=await det.detect(v);
        if(codes.length){
          const val=codes[0].rawValue, now=Date.now();
          if(val!==last||now-lastAt>2500){ last=val; lastAt=now; takeScan(val); }
        }
      }catch(e){}
      if(camStream) setTimeout(tick,400);
    };
    tick();
  }catch(e){
    btn.textContent='Use camera';
    showHit('<div class="hit-sku">Camera unavailable</div><div class="hit-meta">Permission was refused, or this page is not on https. A handheld scanner works either way.</div>','miss');
  }
}

/* ============================================================
   Catalog — the master SKU list (UPC, SKU, Brand, Qty, Category,
   Name, Packing). Each line is one physical batch: if a SKU sits
   in two places it has two lines. Placing a line writes into S.inv
   the same way Scan does, tagged with _catId so the two stay in
   sync and the map hover reads it identically either way.
   ============================================================ */
let catQuery='', catSeq=0, catImportOpen=false;
function newCatId(){ return 'c'+Date.now().toString(36)+(catSeq++); }
function catInfo(sku){
  const s=(sku||'').toUpperCase();
  return (S.catLines||[]).find(l=>(l.sku||'').toUpperCase()===s);
}
/* if a catalog line's placement was removed some other way (the
   Inventory tab's Remove button, clearing a slot's brand, deleting
   a rack), drop the stale location off the line rather than keep
   claiming a spot it no longer holds. */
function reconcileCatalog(){
  (S.catLines||[]).forEach(l=>{
    if(l.loc){
      const arr=S.inv[l.loc];
      if(!arr||!arr.some(x=>x._catId===l.id)) l.loc='';
    }
  });
}
function removeCatPlacement(line){
  if(!line.loc) return;
  const arr=S.inv[line.loc];
  if(arr){
    const idx=arr.findIndex(x=>x._catId===line.id);
    if(idx>-1) arr.splice(idx,1);
    if(!arr.length) delete S.inv[line.loc];
  }
  line.loc='';
}
/* ------------------------------------------------------------------
   Bulk upload, built the way Reorder's importer works: read every sheet
   in the workbook, find the header row, bind columns to fields, show a
   manifest you can correct, dry-run it, then commit.

   Only five fields are accepted — UPC, SKU, Brand, Packing, Qty.
   Anything else in the file is listed as ignored rather than guessed at.
   ------------------------------------------------------------------ */
/* ------------------------------------------------------------------
   Bulk upload, built the way Reorder's importer works: read every sheet
   in the workbook, find the header row, bind columns to fields, show a
   manifest you can correct, dry-run it, then commit.

   One engine, two users — the Catalog tab (UPC/SKU/brand/packing/qty)
   and the Bulk entry tab (location/brand). Only the field set, the
   validator and the host element ids differ.
   ------------------------------------------------------------------ */
const squash = v => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g,'');

/** The header row is the first within the top 12 carrying a required-field cell. */
function findHeaderRow(rows, fields, required){
  const anchors=new Set(required.flatMap(f=>fields[f]));
  for(let i=0;i<Math.min(12,rows.length);i++){
    const cells=(rows[i]||[]).map(squash);
    if(cells.some(c=>anchors.has(c))) return i;
  }
  return -1;
}

/** Bind columns to fields. Aliases are walked in declared order, so the
    preferred spelling wins rather than whichever column came first. */
function autoMap(headers, fields){
  const map={}, taken=new Set(), sq=headers.map(squash);
  for(const [field,aliases] of Object.entries(fields)){
    for(const alias of aliases){
      const idx=sq.findIndex((h,i)=>!taken.has(i)&&h===alias);
      if(idx>=0){ map[field]=idx; taken.add(idx); break; }
    }
  }
  return map;
}

async function readWorkbook(file, fields, required){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheets=[];
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,blankrows:false,defval:''});
    const headerIdx=findHeaderRow(rows,fields,required);
    if(headerIdx<0){ sheets.push({name,usable:false}); continue; }
    const headers=(rows[headerIdx]||[]).map(h=>String(h??'').trim());
    const map=autoMap(headers,fields);
    const body=rows.slice(headerIdx+1);
    const keyCol=map[required[0]];
    const dataCount=body.filter(r=>String(r[keyCol]??'').trim()!=='').length;
    sheets.push({ name, usable:true, headerIdx, headers, map, body, dataCount,
      include: dataCount>0 && required.every(f=>map[f]!==undefined) });
  }
  return sheets;
}

function issueList(title,items){
  if(!items.length) return '';
  return `<h3 style="margin:18px 0 6px">${title} (${items.length})</h3>
    <div class="cap"><table><thead><tr><th>Row</th><th>Key</th><th>Detail</th></tr></thead>
    <tbody>${items.slice(0,40).map(x=>`<tr><td class="mono">${esc(x.rowRef||'')}</td>
      <td class="mono">${esc(x.key||'')}</td>
      <td>${esc((x.reasons||x.notes||[]).join('; '))}</td></tr>`).join('')}</tbody></table></div>
    ${items.length>40?'<p class="note">Showing the first 40.</p>':''}`;
}

/**
 * Wire up one importer. `cfg` supplies the field set, the labels, the ids of
 * the host elements, and a commit(rows, opts) that validates and — unless it
 * is a dry run — writes. Everything else is shared.
 */
function makeImporter(cfg){
  let sheets=[];
  const $$ = id => $('#'+cfg.ids[id]);

  function drawPicker(){
    const usable=sheets.filter(x=>x.usable);
    const skipped=sheets.filter(x=>!x.usable);
    $$('sheetlist').innerHTML = usable.map((sh,i)=>{
      const missing=cfg.required.filter(f=>sh.map[f]===undefined);
      const why = missing.length
        ? `<span class="pill bad">no ${missing.map(f=>cfg.labels[f]).join(' or ')}</span>`
        : (cfg.wanted||[]).filter(f=>sh.map[f]===undefined).length
          ? `<span class="pill warn">no ${(cfg.wanted||[]).filter(f=>sh.map[f]===undefined)
              .map(f=>cfg.labels[f].toLowerCase()).join(', ')}</span>` : '';
      return `<label style="display:flex;gap:9px;align-items:center;font-weight:400;margin:5px 0">
        <input type="checkbox" data-sheet="${i}" ${sh.include?'checked':''} style="width:auto">
        <span class="mono">${esc(sh.name)}</span>
        <span class="pill ${sh.dataCount?'ok':'warn'}">${sh.dataCount} rows</span>${why}
      </label>`;
    }).join('') + (skipped.length
      ? `<p class="note">Skipped, no ${cfg.labels[cfg.required[0]]} column: ${
          skipped.map(x=>esc(x.name)).join(', ')}</p>` : '');

    $$('sheetlist').querySelectorAll('input[data-sheet]').forEach(cb=>cb.onchange=()=>{
      usable[+cb.dataset.sheet].include=cb.checked;
      drawManifests();
    });
  }

  function drawManifests(){
    const chosen=sheets.filter(x=>x.usable&&x.include);
    $$('manifests').innerHTML = chosen.map(sh=>{
      const claimed=new Set(Object.values(sh.map));
      const ignored=sh.headers.filter((h,i)=>h&&!claimed.has(i));
      const rows=sh.headers.map((h,i)=>{
        if(!h) return '';
        const current=Object.keys(sh.map).find(f=>sh.map[f]===i)||'';
        const opts=['<option value="">— not imported —</option>']
          .concat(Object.keys(cfg.fields).map(f=>
            `<option value="${f}" ${f===current?'selected':''}>${cfg.labels[f]}</option>`));
        return `<div class="maprow">
          <span class="from">${esc(h)}</span><span class="arrow">→</span>
          <select data-s="${esc(sh.name)}" data-col="${i}">${opts.join('')}</select>
        </div>`;
      }).join('');
      const missing=cfg.required.filter(f=>sh.map[f]===undefined);
      return `<div class="manifest">
        <div class="manifest-head">
          <span class="sheet">${esc(sh.name)}</span>
          <span class="count">header on row ${sh.headerIdx+1} · ${
            sh.headers.filter(Boolean).length} columns · ${claimed.size} mapped</span>
          ${missing.length
            ? `<span class="pill bad">missing ${missing.map(f=>cfg.labels[f]).join(', ')}</span>`
            : '<span class="pill ok">ready</span>'}
        </div>
        <div class="manifest-body">${rows}</div>
        ${ignored.length?`<div class="note" style="margin:0 14px 12px">Ignored: ${
          esc(ignored.join(', '))}. ${esc(cfg.ignoreNote)}</div>`:''}
      </div>`;
    }).join('') || '<p class="note">Tick at least one sheet.</p>';

    $$('manifests').querySelectorAll('select[data-col]').forEach(sel=>sel.onchange=()=>{
      const sh=sheets.find(x=>x.name===sel.dataset.s);
      const col=+sel.dataset.col;
      for(const f of Object.keys(sh.map)) if(sh.map[f]===col) delete sh.map[f];
      if(sel.value){
        for(const f of Object.keys(sh.map)) if(f===sel.value) delete sh.map[f];
        sh.map[sel.value]=col;
      }
      drawManifests();
    });
    $$('commit').disabled = !chosen.some(sh=>sh.dataCount>0);
  }

  function buildRows(){
    const out=[];
    for(const sh of sheets.filter(x=>x.usable&&x.include)){
      sh.body.forEach((r,i)=>{
        if(String(r[sh.map[cfg.required[0]]]??'').trim()==='') return;
        const rec={ __row:`${sh.name}!${sh.headerIdx+2+i}` };
        for(const [f,col] of Object.entries(sh.map)) rec[f]=r[col];
        out.push(rec);
      });
    }
    return out;
  }

  function run(dryRun){
    const rows=buildRows();
    if(!rows.length){
      $$('result').innerHTML='<div class="note warn">No rows to import from the ticked sheets.</div>';
      return null;
    }
    const out=cfg.commit(rows,{dryRun});
    const s=out.summary;
    $$('result').innerHTML = (out.committed
        ? `<div class="note ok">${esc(cfg.savedMessage(s))}</div>`
        : `<div class="note">Nothing saved yet — this is the check. Press <strong>${
            esc(cfg.commitLabel)}</strong> to commit.</div>`)
      + `<div class="stats">${cfg.stats(s).map(([k,v])=>
          `<div><span>${esc(k)}</span><strong>${v}</strong></div>`).join('')}</div>`
      + issueList('Rejected rows',out.rejected||[])
      + issueList('Worth a look',out.warnings||[]);
    return out;
  }

  return {
    reset(){ sheets=[]; },
    wire(){
      $$('file').onchange=async e=>{
        const f=e.target.files[0];
        $$('result').innerHTML='';
        $$('commit').disabled=true;
        if(!f){ $$('sheets').classList.add('hidden'); return; }
        try{
          sheets=await readWorkbook(f,cfg.fields,cfg.required);
          if(!sheets.some(x=>x.usable)){
            $$('sheets').classList.add('hidden');
            $$('result').innerHTML=`<div class="note bad">No sheet in this file has a
              <strong>${esc(cfg.labels[cfg.required[0]])}</strong> column. Check the spelling of that
              header, and that the header row is within the first 12 rows.</div>`;
            return;
          }
          $$('sheets').classList.remove('hidden');
          drawPicker();
          drawManifests();
        }catch(err){
          $$('result').innerHTML=`<div class="note bad">Could not read the file: ${esc(err.message)}</div>`;
        }
      };
      $$('check').onclick=()=>{
        const out=run(true);
        if(out) $$('commit').disabled = out.summary.accepted===0;
      };
      $$('commit').onclick=()=>{
        if(cfg.confirmBeforeCommit && !confirm(cfg.confirmBeforeCommit())) return;
        const out=run(false);
        if(out){ $$('commit').disabled=true; if(cfg.after) cfg.after(); }
      };
    }
  };
}

/** The markup both importers drop into their tab. Ids are prefixed per user. */

const importerIds = pfx => ({ file:`${pfx}-file`, sheets:`${pfx}-sheets`,

/* ---------------- Catalog: UPC, SKU, brand, packing, qty ---------------- */
const CAT_FIELDS = {
  sku:     ['sku','skucode','itemcode','item','code','articlecode','model','modelno'],
  upc:     ['upc','ean','barcode','gtin','ean13','code128','itemupc','pieceupc',
            'unitupc','innerupc','upcitem','itembarcode'],
  boxUpc:  ['boxupc','cartonupc','outerupc','masterupc','upcbox','boxbarcode',
            'cartonbarcode','outerbarcode','mastercartonupc','ctnupc','boxean'],
  brand:   ['brand','brandname','sl','subbrand'],
  packing: ['packing','packingqty','pack','packsize','pcspercarton','pcsctn','pcsperctn',
            'qtypercarton','pcsperbox','qtyperbox','innerqty'],
  qty:     ['qty','quantity','total','totalqty','pieces','pcs','onhand','stock','balance'],
  imageUrl:['image','imageurl','imagelink','photo','picture','img','imgurl','thumbnail']
};
const CAT_LABEL = { sku:'SKU', upc:'Item UPC (single piece)', boxUpc:'Box UPC (full carton)',
  brand:'Brand', packing:'Packing (pcs per carton)', qty:'Qty', imageUrl:'Image URL' };

/**
 * Bring a file into the catalog.
 *
 * Default is to update in place rather than append, because the same file gets
 * re-uploaded whenever the master changes and appending turns one SKU into
 * three. A row is matched to an existing line by UPC when it has one, and by
 * SKU otherwise, so a file that gains barcodes later still lands on the right
 * lines instead of creating a second set.
 */
function catKeyOf(upc, sku){
  return upc ? 'U:'+upc : 'S:'+String(sku||'').trim().toUpperCase();
}

function commitCatalog(rows,{dryRun}){
  const rejected=[], warnings=[], parsed=[];
  const mode = ($('#c-mode') && $('#c-mode').value) || 'update';

  rows.forEach(r=>{
    const sku=String(r.sku??'').trim();
    const rowRef=r.__row||'';
    if(!sku){ rejected.push({rowRef,key:'',reasons:['no SKU']}); return; }
    const upc=String(r.upc??'').replace(/\D/g,'');
    const boxUpc=String(r.boxUpc??'').replace(/\D/g,'');
    const brand=String(r.brand??'').trim().toUpperCase();
    const packing=num(r.packing), qty=num(r.qty);
    const rawImg=String(r.imageUrl??'').trim();
    const imageUrl=/^https?:\/\//i.test(rawImg)?rawImg:'';
    const notes=[];
    if(!packing) notes.push('no packing, so boxes cannot be worked out');
    if(qty===null) notes.push('no qty, treated as 0');
    if(brand&&!brandOf(brand)) notes.push(`brand "${brand}" is not in the palette yet`);
    if(rawImg&&!imageUrl) notes.push('image URL ignored — it must start with http');
    if(boxUpc&&boxUpc===upc) notes.push('item and box UPC are the same — a box scan cannot be told apart from a piece');
    if(boxUpc&&!packing) notes.push('box UPC given but no packing, so a box scan cannot be converted to pieces');
    parsed.push({ rowRef, sku, upc, boxUpc, brand, packing, qty:qty===null?0:qty, imageUrl, notes });
  });

  // Work out what would happen before doing any of it, so the dry run and the
  // real thing report identical numbers.
  const current = mode==='replace' ? [] : (S.catLines||[]);
  // Only 'update' looks for matches. 'append' deliberately adds everything.
  const existing = mode==='update' ? current : [];
  const byKey = new Map();
  existing.forEach(l=>{
    const k=catKeyOf(l.upc,l.sku);
    if(!byKey.has(k)) byKey.set(k,[]);
    byKey.get(k).push(l);
  });
  // A file row with a UPC should still find a line stored without one.
  const bySku = new Map();
  existing.forEach(l=>{
    const k='S:'+String(l.sku||'').toUpperCase();
    if(!bySku.has(k)) bySku.set(k,[]);
    bySku.get(k).push(l);
  });

  let created=0, updated=0, qtyHeld=0;
  const plan=[];
  const seenThisFile=new Set();

  parsed.forEach(p=>{
    const k=catKeyOf(p.upc,p.sku);
    let hits = byKey.get(k) || [];
    if(!hits.length && p.upc) hits = bySku.get('S:'+p.sku.toUpperCase()) || [];
    if(seenThisFile.has(k) && hits.length){
      p.notes.push('this file lists the same item more than once — the last row wins');
    }
    seenThisFile.add(k);

    if(hits.length){
      updated++;
      // Quantity is per location. With the item in several places, the file
      // cannot say which one it refers to, so descriptive fields update and
      // the quantities are left alone rather than guessed at.
      const placed = hits.filter(h=>h.loc);
      if(hits.length>1 && placed.length>1){
        qtyHeld++;
        p.notes.push(`in ${placed.length} locations — details updated, quantities left as they are`);
      }
      plan.push({ type:'update', hits, p, setQty: !(hits.length>1 && placed.length>1) });
    } else {
      created++;
      plan.push({ type:'create', p });
    }
    if(p.notes.length) warnings.push({ rowRef:p.rowRef, key:p.sku, notes:p.notes });
  });

  const summary={ rowsReceived:rows.length, accepted:parsed.length, created, updated,
    rejected:rejected.length, warnings:warnings.length, qtyHeld,
    linesAfter: current.length + created };

  if(!dryRun){
    if(mode==='replace'){
      Object.keys(S.inv).forEach(loc=>{
        S.inv[loc]=S.inv[loc].filter(x=>!x._catId);
        if(!S.inv[loc].length) delete S.inv[loc];
      });
      S.catLines=[];
    }
    plan.forEach(step=>{
      const p=step.p;
      if(step.type==='create'){
        S.catLines.push({ id:newCatId(), upc:p.upc, boxUpc:p.boxUpc, sku:p.sku, brand:p.brand,
          packing:p.packing, qty:p.qty, imageUrl:p.imageUrl, loc:'' });
        return;
      }
      step.hits.forEach(h=>{
        // Blank cells never wipe something already recorded.
        if(p.upc) h.upc=p.upc;
        if(p.boxUpc) h.boxUpc=p.boxUpc;
        if(p.brand) h.brand=p.brand;
        if(p.packing!=null) h.packing=p.packing;
        if(p.imageUrl) h.imageUrl=p.imageUrl;
        h.sku=p.sku;
        if(step.setQty) h.qty=p.qty;
        // Stock already placed from this line follows the change.
        if(h.loc&&S.inv[h.loc]){
          const line=S.inv[h.loc].find(x=>x._catId===h.id);
          if(line){ line.sku=h.sku; line.packing=h.packing; line.qty=h.qty;
            line.boxes=h.packing?+(h.qty/h.packing).toFixed(2):null; }
        }
      });
    });
    (S.catLines||[]).forEach(l=>{ if(l.brand&&!brandOf(l.brand))
      S.brands.push({name:l.brand,color:FALLBACK[S.brands.length%FALLBACK.length]}); });
    commit();
  }
  return { summary, rejected, warnings, committed:!dryRun };
}

/**
 * Fold existing duplicates together. Needed once, for catalogs that grew a
 * second and third copy of everything before importing learned to update.
 *
 * Grouped by SKU alone, not by UPC: repeated imports often recorded a
 * different barcode each time, so the copies of one product rarely agree on
 * UPC. The SKU is what identifies the item.
 */
function mergeCatalogDuplicates(){
  const lines=S.catLines||[];
  const groups=new Map();
  lines.forEach(l=>{
    const k=String(l.sku||'').trim().toUpperCase();
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(l);
  });

  let removed=0;
  const keep=[];
  groups.forEach(g=>{
    if(g.length===1){ keep.push(g[0]); return; }
    // Placed lines are real stock in a real slot and are never folded away.
    const placed=g.filter(l=>l.loc);
    const loose=g.filter(l=>!l.loc);
    if(placed.length){
      keep.push(...placed);
      loose.forEach(l=>{ removed++; });
      // Anything the unplaced copies knew that the placed ones did not.
      placed.forEach(t=>loose.forEach(l=>{
        if(!t.upc&&l.upc) t.upc=l.upc;
        if(!t.boxUpc&&l.boxUpc) t.boxUpc=l.boxUpc;
        if(!t.brand&&l.brand) t.brand=l.brand;
        if(t.packing==null&&l.packing!=null) t.packing=l.packing;
        if(!t.imageUrl&&l.imageUrl) t.imageUrl=l.imageUrl;
      }));
      return;
    }
    // All unplaced: keep the richest one and merge the rest into it.
    const score=l=>(l.upc?1:0)+(l.brand?1:0)+(l.packing!=null?1:0)+(l.imageUrl?1:0)+(+l.qty>0?1:0);
    const best=g.slice().sort((a,b)=>score(b)-score(a))[0];
    g.forEach(l=>{
      if(l===best) return;
      if(!best.upc&&l.upc) best.upc=l.upc;
      if(!best.boxUpc&&l.boxUpc) best.boxUpc=l.boxUpc;
      if(!best.brand&&l.brand) best.brand=l.brand;
      if(best.packing==null&&l.packing!=null) best.packing=l.packing;
      if(!best.imageUrl&&l.imageUrl) best.imageUrl=l.imageUrl;
      if(!(+best.qty>0)&&+l.qty>0) best.qty=l.qty;
      removed++;
    });
    keep.push(best);
  });

  S.catLines=keep;
  return removed;
}

const catImporter = makeImporter({
  fields:CAT_FIELDS, labels:CAT_LABEL, required:['sku'], wanted:['qty'],
  ids: importerIds('c'),
  ignoreNote:'This tool takes SKU, item UPC, box UPC, brand, packing, qty and an image URL.',
  commitLabel:'Save to catalog',
  commit: commitCatalog,
  stats: s => [['Rows read',s.rowsReceived],['Updated',s.updated],['Added',s.created],
    ['Rejected',s.rejected],['Worth a look',s.warnings]],
  savedMessage: s => `Saved. ${s.updated} line${s.updated===1?'':'s'} updated, ${s.created} added — `
    + `the catalog now holds ${s.linesAfter}.`,
  confirmBeforeCommit: () => $('#c-mode').value!=='replace' ? true
    : confirm('This wipes the current catalog and every location placed from it, then imports this file. Continue?'),
  after: () => renderCatalog()
});

/* ------------- Bulk entry: location, brand (the rack sheets) ------------- */
const ASSIGN_FIELDS = {
  location: ['location','loc','slot','position','rackslot','bin','code','address'],
  brand:    ['brand','brands','brandname','sl','subbrand','item','contents','assignment']
};
const ASSIGN_LABEL = { location:'Location', brand:'Brand' };

function commitAssignments(rows,{dryRun}){
  const rejected=[], warnings=[];
  let ok=0, made=0, cleared=0;
  const locked=new Set(), newBrands=new Set();
  const create = $('#e-create') ? $('#e-create').checked : true;
  const addNew = $('#e-new') ? $('#e-new').checked : true;
  // Applied to a scratch copy on a dry run, so a check writes nothing.
  const racks = dryRun ? JSON.parse(JSON.stringify(S.racks)) : S.racks;
  const assign = dryRun ? {...S.assign} : S.assign;
  const brands = dryRun ? S.brands.slice() : S.brands;

  rows.forEach(r=>{
    const rowRef=r.__row||'';
    const loc=String(r.location??'').toUpperCase().replace(/\s+/g,'');
    const m=loc.match(/^([A-Z]{1,3})(\d+)\.(\d+)$/);
    if(!m){ rejected.push({rowRef,key:loc,reasons:['not a location like A4.1 or LCA1.1']}); return; }
    const [,rk,bay,layerStr]=m, layer=+layerStr;
    if(isLocked(rk)){ locked.add(rk); rejected.push({rowRef,key:loc,reasons:[`${rackName(rk)} is locked`]}); return; }

    const names=splitBrands(String(r.brand??''));
    if(!names.length){
      // A blank brand clears the slot rather than being treated as an error.
      if(assign[loc]){ delete assign[loc]; cleared++; }
      warnings.push({rowRef,key:loc,notes:['no brand, so the slot was cleared']});
      return;
    }
    if(!racks[rk]) racks[rk]={};
    const arr=racks[rk][bay]||[];
    if(!arr.includes(layer)){
      if(!create){ rejected.push({rowRef,key:loc,reasons:['no slot there — tick "create slots"']}); return; }
      racks[rk][bay]=[...arr,layer].sort((x,y)=>x-y); made++;
    }
    const notes=[];
    const keep=[];
    names.forEach(n=>{
      if(!brands.find(b=>b.name===n)){
        if(!addNew){ notes.push(`brand "${n}" is unknown and was skipped`); return; }
        brands.push({name:n,color:FALLBACK[brands.length%FALLBACK.length]});
        newBrands.add(n);
      }
      keep.push(n);
    });
    if(keep.length>3) notes.push('more than three brands on one slot — only the first three are kept');
    if(notes.length) warnings.push({rowRef,key:loc,notes});
    if(keep.length){ assign[loc]=keep.slice(0,3); ok++; }
  });

  const summary={ rowsReceived:rows.length, accepted:ok, rejected:rejected.length,
    warnings:warnings.length, made, cleared,
    newBrands:[...newBrands], lockedRacks:[...locked] };
  if(!dryRun) commit();
  return { summary, rejected, warnings, committed:!dryRun };
}

      $('#ce-err').classList.remove('hidden'); return;
    }
    const brand=$('#ce-brand').value.trim().toUpperCase();
    if(brand&&!brandOf(brand)) S.brands.push({name:brand,color:FALLBACK[S.brands.length%FALLBACK.length]});

  editingCat=null;

function startPlace(id){
  const line=(S.catLines||[]).find(x=>x.id===id); if(!line) return;
  const raw=prompt(`Location for ${line.sku}${line.brand?' — '+line.brand:''}`, line.loc||'');
  if(raw===null) return;
  const code=raw.toUpperCase().replace(/\s+/g,'');
  const m=code.match(/^([A-Z]{1,3})(\d+)\.(\d+)$/);
  if(!m){ toast('Location should look like A4.1 or LCA1.1'); return; }
  const rk=m[1];
  if(isLocked(rk)){ toast(`${rackName(rk)} is locked`); return; }
  const qtyRaw=prompt(`Quantity at ${code}`, String(line.qty||''));
  if(qtyRaw===null) return;
  const qty=num(qtyRaw);
  if(qty==null){ toast('Enter a number for quantity'); return; }

  if(line.loc) removeCatPlacement(line);
  const bay=m[2], layer=+m[3];
  if(!S.racks[rk]) S.racks[rk]={};
  const arr=S.racks[rk][bay]||[];
  if(!arr.includes(layer)) S.racks[rk][bay]=[...arr,layer].sort((a,b)=>a-b);
  S.inv[code]=S.inv[code]||[];
  const boxes=line.packing?+(qty/line.packing).toFixed(2):null;
  S.inv[code].push({sku:line.sku,boxes,packing:line.packing,qty,_catId:line.id});
  line.loc=code;
  commit(); renderCatalogResults();
  toast(`${line.sku} placed at ${code}`);
}
function unplaceCatLine(id){
  const line=(S.catLines||[]).find(x=>x.id===id); if(!line) return;
  const loc=line.loc;
  removeCatPlacement(line);
  commit(); renderCatalogResults();
  toast(`${line.sku} removed from ${loc}`);
}

  /* The first import predated the box/item split, so everything landed in the
     item field. This moves those codes across, and only where the box field is
     still empty, so it cannot overwrite anything entered since. */
  $('#c-tobox').onclick=()=>{
    const lines=S.catLines||[];
    const movable=lines.filter(l=>l.upc&&!l.boxUpc);
    if(!movable.length) return toast('Nothing to move — no item UPCs without a box UPC');
    if(!confirm(`Treat ${movable.length} existing UPC${movable.length===1?'':'s'} as box barcodes?\n\n`
      +'They move from the item field to the box field. The item field is left blank, ready for '
      +'the single-piece barcodes when you have them.')) return;
    movable.forEach(l=>{ l.boxUpc=l.upc; l.upc=''; });
    commit(); renderCatalog();
    toast(`${movable.length} code${movable.length===1?'':'s'} moved to Box UPC`);
  };

  $('#c-dedupe').onclick=()=>{
    const before=(S.catLines||[]).length;
    if(!before) return toast('Nothing in the catalog yet');
    const removed=mergeCatalogDuplicates();
    if(!removed){ toast('No duplicates found'); return; }
    commit(); renderCatalog();
    toast(`${removed} duplicate line${removed===1?'':'s'} merged — ${before} down to ${S.catLines.length}`);
  };

  $('#c-clear').onclick=()=>{
    if(!confirm('Delete the entire catalog and remove every location placed from it? Anything scanned in on the Scan tab is left alone.')) return;
    Object.keys(S.inv).forEach(loc=>{ S.inv[loc]=S.inv[loc].filter(x=>!x._catId); if(!S.inv[loc].length) delete S.inv[loc]; });
    S.catLines=[]; commit(); renderCatalog(); toast('Catalog cleared');
  };

  $('#c-csv').onclick=()=>{

    (S.catLines||[]).forEach(l=>rows.push([l.upc||'',l.boxUpc||'',l.sku,l.brand||'',
      l.packing??'',l.qty||0,l.imageUrl||'',l.loc||'']));
    if(rows.length===1) return toast('Nothing in the catalog yet');
    const csv=rows.map(r=>r.map(v=>/[",]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
    download('catalog.csv',csv,'text/csv');
    toast('Catalog CSV downloaded');
  };

  $('#c-search').oninput=e=>{ catQuery=e.target.value; renderCatalogResults(); };
  renderCatalogResults();
